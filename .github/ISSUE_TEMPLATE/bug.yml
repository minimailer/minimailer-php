name: Bug Report
description: Report an issue or bug with the SDK
title: "[Bug]: "
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              We're sorry to hear you have a problem. Can you help us solve it by providing the following details?

              **Do not report security vulnerabilities here** — see the security policy instead.
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What did you expect to happen?
          placeholder: I cannot currently do X thing because when I do, it breaks Y thing.
      validations:
          required: true
    - type: textarea
      id: how-to-reproduce
      attributes:
          label: How to reproduce the bug
          description: Provide a minimal code sample and a reliable set of steps if possible. Redact your API key.
          placeholder: When I call $mailer->emails()->create(...) with X, I see Y.
      validations:
          required: true
    - type: input
      id: package-version
      attributes:
          label: SDK Version
          description: Which version of `minimailer/minimailer-php` are you running? Please be as specific as possible.
          placeholder: 1.0.0
      validations:
          required: true
    - type: input
      id: php-version
      attributes:
          label: PHP Version
          placeholder: 8.3.14
      validations:
          required: true
    - type: dropdown
      id: http-client
      attributes:
          label: Which HTTP client are you using?
          options:
              - Guzzle (the default)
              - A different PSR-18 client
              - Not sure
      validations:
          required: false
    - type: textarea
      id: notes
      attributes:
          label: Notes
          description: Any other detail you feel is relevant. Redact API keys, recipient addresses and message content.
      validations:
          required: false
